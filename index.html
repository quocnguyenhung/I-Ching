<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gieo Quẻ Kinh Dịch 6 Hào</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
    :root {
        --ink: #2c2925;
        --ink-soft: #5c554b;
        --ink-light: #948c80;
        --cinnabar: #a93226;
        --cinnabar-deep: #7b241c;
        --paper: #f6f3ed;
        --paper-dark: #e8e3d8;
        --line: #2c2925;
        --moving: #a93226;
        --cast-bar-h: 90px;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: "Be Vietnam Pro", sans-serif;
        color: var(--ink);
        background-color: var(--paper);
        background-image:
            linear-gradient(rgba(44, 41, 37, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(44, 41, 37, 0.03) 1px, transparent 1px);
        background-size: 20px 20px;
    }
    .page {
        position: relative;
        max-width: 500px;
        margin: 0 auto;
        padding: 28px 20px calc(var(--cast-bar-h) + env(safe-area-inset-bottom, 0px) + 24px);
        text-align: center;
    }
    .brand {
        font-family: "Noto Serif", serif;
        font-size: 2.1rem;
        font-weight: 700;
        color: var(--ink);
        margin: 0 0 10px;
        line-height: 1.2;
    }
    .brand span {
        display: block;
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--cinnabar);
        margin-bottom: 6px;
    }
    .lead {
        margin: 0 auto 18px;
        font-size: 0.9rem;
        line-height: 1.55;
        color: var(--ink-soft);
        max-width: 40ch;
    }
    .progress {
        margin: 0 auto 14px;
        max-width: 300px;
    }
    .progress-labels {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 0.72rem;
        color: var(--ink-light);
        font-weight: 600;
    }
    .progress-track { display: flex; gap: 6px; }
    .progress-step {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--paper-dark);
        transition: background 0.3s ease;
    }
    .progress-step.done { background: var(--ink-soft); }
    .progress-step.current { background: var(--cinnabar); }

    .coins {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 0 auto 16px;
        min-height: 68px;
        perspective: 700px;
    }
    .coin {
        width: 64px;
        height: 64px;
        position: relative;
    }
    .coin-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
    }
    .coin.idle { opacity: 0.45; }
    .coin.idle .coin-inner { transform: rotateY(0deg); }
    .coin.yang .coin-inner { transform: rotateY(0deg); }
    .coin.yin .coin-inner { transform: rotateY(180deg); }
    .coin.flip .coin-inner { animation: coinFlipYang 1s cubic-bezier(0.22, 0.7, 0.3, 1) both; }
    .coin.flip.yin .coin-inner { animation-name: coinFlipYin; }
    .coin:nth-child(2).flip .coin-inner { animation-delay: 0.05s; }
    .coin:nth-child(3).flip .coin-inner { animation-delay: 0.1s; }
    .coin-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: 50%;
        overflow: hidden;
    }
    .coin-face svg { width: 100%; height: 100%; display: block; }
    .face-yin { transform: rotateY(180deg); }

    .hexagram-display {
        display: flex;
        flex-direction: column-reverse;
        width: 100%;
        max-width: 280px;
        margin: 0 auto;
        gap: 10px;
    }
    .line {
        display: grid;
        grid-template-columns: 45px 1fr 90px;
        align-items: center;
        gap: 10px;
        font-size: 0.82rem;
        color: var(--ink-light);
        min-height: 24px;
    }
    .line.filled { color: var(--ink); }
    .line-bar { height: 14px; width: 100%; position: relative; }
    .line-placeholder {
        height: 100%;
        width: 100%;
        background: rgba(44, 41, 37, 0.1);
        border-radius: 2px;
    }
    .yang, .yin { width: 100%; height: 100%; border-radius: 2px; background: var(--line); }
    .yin { display: flex; justify-content: space-between; background: transparent; }
    .yin div { width: 44%; height: 100%; background: var(--line); border-radius: 2px; }
    .yang.moving { background: var(--cinnabar); }
    .yin .moving { background: var(--cinnabar); }
    .line-type { text-align: right; font-weight: 500; white-space: nowrap; }

    .result-box {
        margin-top: 18px;
        padding: 18px 16px;
        background: #fff;
        border: 1px solid var(--paper-dark);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        display: none;
        animation: fadeRise 0.6s ease forwards;
        text-align: left;
    }
    .result-box.visible { display: block; }
    .result-box h3 {
        font-family: "Noto Serif", serif;
        margin: 0 0 12px;
        color: var(--cinnabar);
        font-size: 1.05rem;
    }
    .copy-block { margin: 0; }
    .copy-container { display: flex; gap: 8px; margin-bottom: 16px; position: relative; align-items: stretch; }
    .copy-input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        background: var(--paper);
        border: 1px solid var(--paper-dark);
        border-radius: 6px;
        font-size: 0.85rem;
        font-family: inherit;
        color: var(--ink);
        outline: none;
    }
    .btn-copy-wrap { position: relative; flex-shrink: 0; }
    .btn-copy {
        background: var(--ink);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0 16px;
        font-family: inherit;
        font-weight: 500;
        font-size: 0.85rem;
        height: 100%;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn-copy.copied { background: var(--cinnabar-deep); }
    .copy-tooltip {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%) translateY(4px);
        background: var(--ink);
        color: var(--paper);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 4px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 5;
    }
    .copy-tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border: 5px solid transparent;
        border-top-color: var(--ink);
    }
    .copy-tooltip.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
    .dual-hex { display: grid; gap: 12px; margin-bottom: 14px; }
    .dual-hex.has-bien { grid-template-columns: 1fr 1fr; }
    .hex-card {
        padding: 12px 8px;
        background: var(--paper);
        border-radius: 6px;
        border: 1px solid var(--paper-dark);
        text-align: center;
    }
    .hex-card-title {
        font-size: 0.7rem;
        color: var(--ink-soft);
        text-transform: uppercase;
        margin-bottom: 6px;
        font-weight: 600;
        letter-spacing: 0.06em;
    }
    .hex-card-name {
        font-family: "Noto Serif", serif;
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 6px;
        color: var(--cinnabar);
        line-height: 1.3;
    }
    .hex-card-trigrams {
        font-size: 0.7rem;
        color: var(--ink-soft);
        margin-bottom: 8px;
    }
    .mini-hex { display: flex; flex-direction: column-reverse; gap: 3px; width: 52px; margin: 0 auto; }
    .mini-line { height: 5px; width: 100%; }
    .mini-line .yang { height: 100%; }
    .mini-line .yin { height: 100%; display: flex; justify-content: space-between; }
    .mini-line .yin div { width: 42%; height: 100%; background: var(--line); }
    .result-row {
        margin: 8px 0;
        font-size: 0.9rem;
        text-align: left;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--paper-dark);
        line-height: 1.45;
    }
    .result-row:last-child { border: none; padding-bottom: 0; }
    .result-row strong { color: var(--ink-soft); display: inline-block; width: 85px; }
    .result-row.hao-dong,
    .result-row.hao-dong strong,
    .result-row.hao-dong span {
        color: var(--cinnabar);
        font-weight: 700;
    }
    .cast-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(0deg, var(--paper) 60%, rgba(246, 243, 237, 0) 100%);
        display: flex;
        justify-content: center;
        pointer-events: none;
    }
    .cast-bar button { pointer-events: auto; }
    #btnCast {
        background: var(--cinnabar);
        color: white;
        font-size: 1.05rem;
        font-family: "Noto Serif", serif;
        padding: 14px 36px;
        border-radius: 50px;
        box-shadow: 0 8px 20px rgba(169, 50, 38, 0.25);
        width: 100%;
        max-width: 320px;
        border: none;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
    }
    #btnCast:hover { background: var(--cinnabar-deep); }
    #btnCast:active { transform: scale(0.96); }
    #btnCast:disabled { background: var(--ink-light); box-shadow: none; cursor: wait; }

    @keyframes fadeRise {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes coinFlipYang {
        0% { transform: translateY(0) rotateY(0deg); }
        32% { transform: translateY(-52px) rotateY(540deg); }
        68% { transform: translateY(6px) rotateY(900deg); }
        100% { transform: translateY(0) rotateY(1080deg); }
    }
    @keyframes coinFlipYin {
        0% { transform: translateY(0) rotateY(0deg); }
        32% { transform: translateY(-52px) rotateY(540deg); }
        68% { transform: translateY(6px) rotateY(900deg); }
        100% { transform: translateY(0) rotateY(1260deg); }
    }

    @media (max-width: 480px) {
        .lead { display: none; }
        .brand { font-size: 1.7rem; margin-bottom: 8px; }
        .page { padding: 16px 16px calc(var(--cast-bar-h) + env(safe-area-inset-bottom, 0px) + 12px); }
        .progress { margin-bottom: 10px; }
        .coins { gap: 10px; margin-bottom: 12px; min-height: 56px; }
        .coin { width: 56px; height: 56px; }
        .hexagram-display { gap: 8px; }
        .line {
            grid-template-columns: 40px 1fr 82px;
            font-size: 0.75rem;
            gap: 8px;
            min-height: 22px;
        }
        .line-bar { height: 12px; }
        .result-box { margin-top: 12px; padding: 14px 12px; }
        .result-box h3 { margin-bottom: 8px; font-size: 1rem; }
        .copy-container { margin-bottom: 10px; }
        .dual-hex { gap: 8px; margin-bottom: 10px; }
        .mini-hex { width: 44px; }
        .hex-card-name { font-size: 0.85rem; }
        .result-row { margin: 6px 0; font-size: 0.82rem; padding-bottom: 6px; }
        --cast-bar-h: 78px;
        #btnCast { font-size: 1rem; padding: 12px 28px; }
    }

    @media (min-width: 768px) {
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background-color: #d9d1c3;
            background-image:
                linear-gradient(rgba(44, 41, 37, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(44, 41, 37, 0.04) 1px, transparent 1px);
        }
        .page {
            width: 420px;
            max-width: 420px;
            max-height: 92vh;
            overflow-y: auto;
            background: var(--paper);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(44, 41, 37, 0.16);
            padding: 32px 24px calc(var(--cast-bar-h) + 20px);
        }
        .cast-bar {
            position: absolute;
            border-radius: 0 0 24px 24px;
            background: linear-gradient(0deg, var(--paper) 70%, rgba(246, 243, 237, 0) 100%);
        }
    }
    </style>
</head>
<body>
    <main class="page">
        <h1 class="brand"><span>Kinh Dịch</span>Gieo Quẻ 6 Hào</h1>
        <p class="lead">Gieo từng hào từ Sơ đến Thượng bằng ba đồng xu cổ. Đủ 6 hào, nhấn Gieo Quẻ Mới để bắt đầu lại.</p>

        <div class="progress" aria-label="Tiến trình 6 hào">
            <div class="progress-labels">
                <span>Sơ</span><span>II</span><span>III</span><span>IV</span><span>V</span><span>Thượng</span>
            </div>
            <div class="progress-track" id="progressTrack">
                <div class="progress-step" data-step="0"></div>
                <div class="progress-step" data-step="1"></div>
                <div class="progress-step" data-step="2"></div>
                <div class="progress-step" data-step="3"></div>
                <div class="progress-step" data-step="4"></div>
                <div class="progress-step" data-step="5"></div>
            </div>
        </div>

        <div class="coins" id="coins" aria-live="polite"></div>

        <div class="hexagram-display" id="hexDisplay" aria-live="polite"></div>

        <div class="result-box" id="resultBox">
            <h3>Kết quả quẻ</h3>

            <div class="copy-block">
                <div class="copy-container">
                    <input type="text" id="summaryText" class="copy-input" readonly aria-label="Tóm tắt kết quả" />
                    <div class="btn-copy-wrap">
                        <button type="button" id="btnCopy" class="btn-copy">Sao chép</button>
                        <span id="copyTooltip" class="copy-tooltip" role="status">Đã sao chép!</span>
                    </div>
                </div>
            </div>

            <div class="dual-hex" id="dualHex"></div>

            <p class="result-row"><strong>Quẻ Chủ:</strong> <span id="queChu"></span></p>
            <p class="result-row hao-dong"><strong>Hào Động:</strong> <span id="haoDong"></span></p>
            <p class="result-row"><strong>Quẻ Biến:</strong> <span id="queBien"></span></p>
        </div>

        <div class="cast-bar">
            <button id="btnCast" type="button">Gieo Hào (0/6)</button>
        </div>
    </main>

<script>
const TRIGRAMS = {
    "111": "Càn", "011": "Đoài", "101": "Ly", "001": "Chấn",
    "110": "Tốn", "010": "Khảm", "100": "Cấn", "000": "Khôn"
};

const HEXAGRAMS = {
    "Càn_Càn": "Thuần Càn", "Khôn_Khôn": "Thuần Khôn", "Khảm_Chấn": "Thủy Lôi Truân", "Cấn_Khảm": "Sơn Thủy Mông",
    "Khảm_Càn": "Thủy Thiên Nhu", "Càn_Khảm": "Thiên Thủy Tụng", "Khảm_Khôn": "Thủy Địa Tỷ", "Khôn_Khảm": "Địa Thủy Sư",
    "Tốn_Càn": "Phong Thiên Tiểu Súc", "Càn_Đoài": "Thiên Trạch Lý", "Khôn_Càn": "Địa Thiên Thái", "Càn_Khôn": "Thiên Địa Bĩ",
    "Càn_Ly": "Thiên Hỏa Đồng Nhân", "Ly_Càn": "Hỏa Thiên Đại Hữu", "Khôn_Cấn": "Địa Sơn Khiêm", "Chấn_Khôn": "Lôi Địa Dự",
    "Đoài_Chấn": "Trạch Lôi Tùy", "Cấn_Tốn": "Sơn Phong Cổ", "Khôn_Đoài": "Địa Trạch Lâm", "Tốn_Khôn": "Phong Địa Quan",
    "Ly_Chấn": "Hỏa Lôi Phệ Hạp", "Cấn_Ly": "Sơn Hỏa Bí", "Cấn_Khôn": "Sơn Địa Bác", "Khôn_Chấn": "Địa Lôi Phục",
    "Càn_Chấn": "Thiên Lôi Vô Vọng", "Cấn_Càn": "Sơn Thiên Đại Súc", "Cấn_Chấn": "Sơn Lôi Di", "Đoài_Tốn": "Trạch Phong Đại Quá",
    "Khảm_Khảm": "Thuần Khảm", "Ly_Ly": "Thuần Ly", "Đoài_Cấn": "Trạch Sơn Hàm", "Chấn_Tốn": "Lôi Phong Hằng",
    "Càn_Cấn": "Thiên Sơn Độn", "Chấn_Càn": "Lôi Thiên Đại Tráng", "Khôn_Ly": "Địa Hỏa Minh Di", "Ly_Khôn": "Hỏa Địa Tấn",
    "Tốn_Ly": "Phong Hỏa Gia Nhân", "Ly_Đoài": "Hỏa Trạch Khuê", "Khảm_Cấn": "Thủy Sơn Kiển", "Chấn_Khảm": "Lôi Thủy Giải",
    "Cấn_Đoài": "Sơn Trạch Tổn", "Tốn_Chấn": "Phong Lôi Ích", "Đoài_Càn": "Trạch Thiên Quải", "Càn_Tốn": "Thiên Phong Cấu",
    "Đoài_Khôn": "Trạch Địa Tụy", "Khôn_Tốn": "Địa Phong Thăng", "Đoài_Khảm": "Trạch Thủy Khốn", "Khảm_Tốn": "Thủy Phong Tỉnh",
    "Đoài_Ly": "Trạch Hỏa Cách", "Ly_Tốn": "Hỏa Phong Đỉnh", "Chấn_Chấn": "Thuần Chấn", "Cấn_Cấn": "Thuần Cấn",
    "Tốn_Cấn": "Phong Sơn Tiệm", "Chấn_Đoài": "Lôi Trạch Quy Muội", "Chấn_Ly": "Lôi Hỏa Phong", "Ly_Cấn": "Hỏa Sơn Lữ",
    "Tốn_Tốn": "Thuần Tốn", "Đoài_Đoài": "Thuần Đoài", "Tốn_Khảm": "Phong Thủy Hoán", "Khảm_Đoài": "Thủy Trạch Tiết",
    "Tốn_Đoài": "Phong Trạch Trung Phu", "Chấn_Cấn": "Lôi Sơn Tiểu Quá", "Khảm_Ly": "Thủy Hỏa Ký Tế", "Ly_Khảm": "Hỏa Thủy Vị Tế"
};

const LINE_LABELS = ["Hào 1", "Hào 2", "Hào 3", "Hào 4", "Hào 5", "Hào 6"];
const CAST_DELAY_MS = 1100;

let currentLines = [];
let casting = false;
let audioCtx = null;

const btnCast = document.getElementById("btnCast");
const btnCopy = document.getElementById("btnCopy");
const hexDisplay = document.getElementById("hexDisplay");
const coinsEl = document.getElementById("coins");
const progressTrack = document.getElementById("progressTrack");
const copyTooltip = document.getElementById("copyTooltip");

btnCast.addEventListener("click", castLine);
btnCopy.addEventListener("click", copySummary);

initCoins();
initSlots();
updateProgress();

function coinFaceSvg(kind, uid) {
    const isYang = kind === "yang";
    const g1 = isYang ? "#f3dc8a" : "#c4a06a";
    const g2 = isYang ? "#c9a227" : "#8a6230";
    const g3 = isYang ? "#7a5a18" : "#3d2a14";
    const ink = isYang ? "#3d2e14" : "#f0e6d0";
    const label = isYang ? "Dương" : "Âm";
    return `
        <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
                <radialGradient id="${uid}" cx="34%" cy="28%" r="72%">
                    <stop offset="0%" stop-color="${g1}"/>
                    <stop offset="55%" stop-color="${g2}"/>
                    <stop offset="100%" stop-color="${g3}"/>
                </radialGradient>
            </defs>
            <circle cx="32" cy="32" r="30" fill="url(#${uid})" stroke="#5c4410" stroke-width="2"/>
            <circle cx="32" cy="32" r="24.5" fill="none" stroke="rgba(255,236,190,0.35)" stroke-width="1.2"/>
            <rect x="25" y="25" width="14" height="14" fill="#1a1510" stroke="#5c4410" stroke-width="1.4"/>
            <text x="32" y="16.5" text-anchor="middle" font-size="7" font-weight="700"
                font-family="Noto Serif, serif" fill="${ink}">${label}</text>
        </svg>
    `;
}

function initCoins() {
    coinsEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
        const coin = document.createElement("div");
        coin.className = "coin idle";
        coin.dataset.coin = String(i);
        coin.innerHTML = `
            <div class="coin-inner">
                <div class="coin-face face-yang">${coinFaceSvg("yang", "gY" + i)}</div>
                <div class="coin-face face-yin">${coinFaceSvg("yin", "gN" + i)}</div>
            </div>
        `;
        coinsEl.appendChild(coin);
    }
}

function initSlots() {
    hexDisplay.innerHTML = "";
    for (let i = 0; i < 6; i++) {
        const lineDiv = document.createElement("div");
        lineDiv.className = "line empty";
        lineDiv.dataset.index = String(i);
        lineDiv.innerHTML = `
            <span>${LINE_LABELS[i]}</span>
            <div class="line-bar"><div class="line-placeholder"></div></div>
            <span class="line-type">Chưa gieo</span>
        `;
        hexDisplay.appendChild(lineDiv);
    }
}

function updateProgress() {
    const steps = progressTrack.querySelectorAll(".progress-step");
    steps.forEach((step, i) => {
        step.classList.remove("done", "current");
        if (i < currentLines.length) step.classList.add("done");
        else if (i === currentLines.length && currentLines.length < 6) step.classList.add("current");
    });
}

function resetCoinsIdle() {
    coinsEl.querySelectorAll(".coin").forEach((coin) => {
        coin.className = "coin idle";
    });
}

function showCoins(values) {
    const coins = coinsEl.querySelectorAll(".coin");
    values.forEach((val, i) => {
        const coin = coins[i];
        const isYang = val === 3;
        coin.classList.remove("flip", "yang", "yin", "idle");
        void coin.offsetWidth;
        coin.className = `coin flip ${isYang ? "yang" : "yin"}`;
        coin.addEventListener("animationend", () => coin.classList.remove("flip"), { once: true });
    });
}

function unlockAudio() {
    try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (err) { /* ignore */ }
}

function playCoinClink(when) {
    if (!audioCtx) return;
    try {
        const t = audioCtx.currentTime + when;
        const dur = 0.09;
        const frames = Math.floor(audioCtx.sampleRate * dur);
        const buffer = audioCtx.createBuffer(1, frames, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < frames; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (frames * 0.12));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const hp = audioCtx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.value = 1800;
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.16, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        noise.connect(hp).connect(ng).connect(audioCtx.destination);
        noise.start(t);

        const osc = audioCtx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(2100 + Math.random() * 400, t);
        osc.frequency.exponentialRampToValueAtTime(720, t + 0.11);
        const og = audioCtx.createGain();
        og.gain.setValueAtTime(0.1, t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(og).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
    } catch (err) { /* ignore */ }
}

function playThreeClinks() {
    playCoinClink(0);
    playCoinClink(0.08);
    playCoinClink(0.16);
}

function hapticForSum(sum) {
    if (!navigator.vibrate) return;
    try {
        if (sum === 6 || sum === 9) navigator.vibrate([40, 50, 120]);
    } catch (err) { /* ignore */ }
}

async function castLine() {
    if (casting) return;

    unlockAudio();

    if (currentLines.length >= 6) {
        resetAll();
    }

    casting = true;
    btnCast.disabled = true;

    const values = [
        Math.random() < 0.5 ? 2 : 3,
        Math.random() < 0.5 ? 2 : 3,
        Math.random() < 0.5 ? 2 : 3
    ];
    const sum = values[0] + values[1] + values[2];

    playThreeClinks();
    showCoins(values);
    await wait(CAST_DELAY_MS);

    currentLines.push(sum);
    fillSlot(currentLines.length - 1, sum);
    updateProgress();
    hapticForSum(sum);

    if (currentLines.length === 6) {
        btnCast.textContent = "Gieo Quẻ Mới";
        calculateResult();
    } else {
        btnCast.textContent = `Gieo Hào (${currentLines.length}/6)`;
    }

    casting = false;
    btnCast.disabled = false;
}

function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
}

function fillSlot(idx, val) {
    const lineDiv = hexDisplay.querySelector(`[data-index="${idx}"]`);
    if (!lineDiv) return;

    const isMoving = val === 6 || val === 9;
    const movingClass = isMoving ? "moving" : "";
    let barHtml;

    if (val === 7 || val === 9) {
        barHtml = `<div class="yang ${movingClass}"></div>`;
    } else {
        barHtml = `<div class="yin"><div class="${movingClass}"></div><div class="${movingClass}"></div></div>`;
    }

    const typeName =
        val === 6 ? "Lão Âm (X)" :
        val === 7 ? "Thiếu Dương" :
        val === 8 ? "Thiếu Âm" :
        "Lão Dương (O)";

    lineDiv.className = "line filled";
    lineDiv.innerHTML = `
        <span>${LINE_LABELS[idx]}</span>
        <div class="line-bar">${barHtml}</div>
        <span class="line-type">${typeName}</span>
    `;
}

function miniHexHtml(bits, movingSet) {
    return bits.map((bit, i) => {
        const moving = movingSet.has(i + 1) ? "moving" : "";
        if (bit === 1) {
            return `<div class="mini-line"><div class="yang ${moving}"></div></div>`;
        }
        return `<div class="mini-line"><div class="yin"><div class="${moving}"></div><div class="${moving}"></div></div></div>`;
    }).join("");
}

function calculateResult() {
    const chuBit = [];
    const bienBit = [];
    const movingLines = [];

    currentLines.forEach((val, index) => {
        if (val === 6) {
            chuBit.push(0);
            bienBit.push(1);
            movingLines.push(index + 1);
        } else if (val === 7) {
            chuBit.push(1);
            bienBit.push(1);
        } else if (val === 8) {
            chuBit.push(0);
            bienBit.push(0);
        } else if (val === 9) {
            chuBit.push(1);
            bienBit.push(0);
            movingLines.push(index + 1);
        }
    });

    const chuNoi = TRIGRAMS[`${chuBit[2]}${chuBit[1]}${chuBit[0]}`];
    const chuNgoai = TRIGRAMS[`${chuBit[5]}${chuBit[4]}${chuBit[3]}`];
    const nameQueChu = HEXAGRAMS[`${chuNgoai}_${chuNoi}`] || `${chuNgoai} ${chuNoi}`;

    const bienNoi = TRIGRAMS[`${bienBit[2]}${bienBit[1]}${bienBit[0]}`];
    const bienNgoai = TRIGRAMS[`${bienBit[5]}${bienBit[4]}${bienBit[3]}`];
    const nameQueBien = HEXAGRAMS[`${bienNgoai}_${bienNoi}`] || `${bienNgoai} ${bienNoi}`;

    document.getElementById("queChu").textContent = `${nameQueChu} (${chuNgoai} trên, ${chuNoi} dưới)`;
    document.getElementById("haoDong").textContent =
        movingLines.length > 0 ? `Hào ${movingLines.join(", ")}` : "Không có hào động";
    document.getElementById("queBien").textContent =
        movingLines.length > 0
            ? `${nameQueBien} (${bienNgoai} trên, ${bienNoi} dưới)`
            : "Không biến";

    const summaryText =
        movingLines.length > 0
            ? `${nameQueChu} động hào ${movingLines.join(", ")} biến ${nameQueBien}`
            : `${nameQueChu} (Tĩnh - Không có hào động)`;

    document.getElementById("summaryText").value = summaryText;

    const movingSet = new Set(movingLines);
    const dual = document.getElementById("dualHex");
    const chuCard = `
        <div class="hex-card">
            <div class="hex-card-title">Quẻ Chủ</div>
            <div class="hex-card-name">${nameQueChu}</div>
            <div class="hex-card-trigrams">${chuNgoai} trên · ${chuNoi} dưới</div>
            <div class="mini-hex">${miniHexHtml(chuBit, movingSet)}</div>
        </div>
    `;

    if (movingLines.length > 0) {
        dual.className = "dual-hex has-bien";
        dual.innerHTML = chuCard + `
            <div class="hex-card">
                <div class="hex-card-title">Quẻ Biến</div>
                <div class="hex-card-name">${nameQueBien}</div>
                <div class="hex-card-trigrams">${bienNgoai} trên · ${bienNoi} dưới</div>
                <div class="mini-hex">${miniHexHtml(bienBit, new Set())}</div>
            </div>
        `;
    } else {
        dual.className = "dual-hex";
        dual.innerHTML = chuCard;
    }

    document.getElementById("resultBox").classList.add("visible");
    copyTooltip.classList.remove("show");
}

function copySummary() {
    const summaryInput = document.getElementById("summaryText");
    const text = summaryInput.value;
    if (!text) return;

    const showOk = () => {
        copyTooltip.classList.add("show");
        btnCopy.classList.add("copied");
        const prev = btnCopy.textContent;
        btnCopy.textContent = "Đã chép!";
        clearTimeout(copySummary._t);
        copySummary._t = setTimeout(() => {
            copyTooltip.classList.remove("show");
            btnCopy.classList.remove("copied");
            btnCopy.textContent = prev;
        }, 2200);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showOk).catch(() => {
            summaryInput.select();
            document.execCommand("copy");
            showOk();
        });
    } else {
        summaryInput.select();
        document.execCommand("copy");
        showOk();
    }
}

function resetAll() {
    currentLines = [];
    initSlots();
    updateProgress();
    resetCoinsIdle();
    document.getElementById("resultBox").classList.remove("visible");
    document.getElementById("summaryText").value = "";
    document.getElementById("dualHex").innerHTML = "";
    document.getElementById("dualHex").className = "dual-hex";
    copyTooltip.classList.remove("show");
    btnCast.textContent = "Gieo Hào (0/6)";
}
</script>
