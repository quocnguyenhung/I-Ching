<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gieo Quẻ Kinh Dịch 6 Hào</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1510;
            --ink-soft: #3d3429;
            --cinnabar: #9b1b1b;
            --cinnabar-deep: #6e1010;
            --paper: #e8dfd0;
            --line: #2a2218;
            --moving: #c0392b;
            --glow: rgba(155, 27, 27, 0.18);
            --slot: rgba(42, 34, 24, 0.14);
            --cast-bar-h: 88px;
            --coin-yang: #c9a227;
            --coin-yin: #6b6358;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: "Be Vietnam Pro", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(155, 27, 27, 0.14), transparent 55%),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(42, 34, 24, 0.12), transparent 50%),
                linear-gradient(165deg, #f7f1e8 0%, #e4d8c4 45%, #d9cbb5 100%);
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.35;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0 auto;
            padding: 28px 20px calc(var(--cast-bar-h) + env(safe-area-inset-bottom, 0px) + 24px);
            text-align: center;
        }

        .brand {
            font-family: "Noto Serif", serif;
            font-size: clamp(1.85rem, 6vw, 2.55rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.15;
            margin: 0 0 8px;
            animation: fadeRise 0.7s ease both;
        }

        .brand span {
            display: block;
            font-size: 0.42em;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--cinnabar);
            margin-bottom: 10px;
        }

        .lead {
            margin: 0 auto 20px;
            max-width: 38ch;
            font-size: 0.9rem;
            line-height: 1.55;
            color: var(--ink-soft);
            animation: fadeRise 0.7s ease 0.1s both;
        }

        /* Progress: Sơ → Thượng */
        .progress {
            margin: 0 auto 18px;
            max-width: 340px;
            animation: fadeRise 0.7s ease 0.14s both;
        }

        .progress-labels {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-bottom: 6px;
            font-size: 0.68rem;
            color: var(--ink-soft);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .progress-track {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }

        .progress-step {
            height: 8px;
            border-radius: 2px;
            background: rgba(42, 34, 24, 0.12);
            border: 1px solid rgba(42, 34, 24, 0.12);
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .progress-step.done {
            background: var(--cinnabar);
            border-color: var(--cinnabar-deep);
        }

        .progress-step.current {
            background: rgba(155, 27, 27, 0.45);
            border-color: var(--cinnabar);
            box-shadow: 0 0 0 2px rgba(155, 27, 27, 0.15);
        }

        /* Coins */
        .coins {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 0 auto 18px;
            min-height: 92px;
            animation: fadeRise 0.7s ease 0.16s both;
        }

        .coin {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            line-height: 1.15;
            border: 2px solid rgba(42, 34, 24, 0.25);
            background: linear-gradient(145deg, #d4c4a8, #b8a78a);
            color: var(--ink);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 4px 12px rgba(26, 21, 16, 0.12);
            transition: transform 0.2s ease, background 0.25s ease, border-color 0.25s ease;
        }

        .coin .coin-face {
            font-size: 0.78rem;
            letter-spacing: 0.04em;
        }

        .coin .coin-val {
            font-size: 1.15rem;
            font-family: "Noto Serif", serif;
        }

        .coin.idle .coin-face { opacity: 0.55; }
        .coin.idle .coin-val { opacity: 0.45; font-size: 0.95rem; }

        .coin.yang {
            background: linear-gradient(145deg, #e8c84a, #c9a227);
            border-color: #a8841a;
            color: #3a2c08;
        }

        .coin.yin {
            background: linear-gradient(145deg, #8a8176, #5c554c);
            border-color: #3d3832;
            color: #f3ebe0;
        }

        .coin.flip {
            animation: coinFlip 0.45s ease;
        }

        .coins-sum {
            margin: -8px auto 16px;
            font-size: 0.82rem;
            color: var(--ink-soft);
            min-height: 1.2em;
            font-weight: 500;
        }

        /* Main casting slots */
        .hexagram-display {
            display: flex;
            flex-direction: column-reverse;
            margin: 8px auto 0;
            width: min(100%, 300px);
            gap: 10px;
            animation: fadeRise 0.7s ease 0.18s both;
        }

        .line {
            display: grid;
            grid-template-columns: 52px 1fr 110px;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--ink-soft);
            min-height: 28px;
        }

        .line.empty { opacity: 0.55; }
        .line.filled { opacity: 1; }
        .line.filled .line-bar {
            animation: lineFill 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .line-bar { height: 14px; width: 100%; }

        .line-placeholder {
            height: 100%;
            width: 100%;
            border-radius: 1px;
            background: repeating-linear-gradient(
                90deg,
                var(--slot) 0,
                var(--slot) 6px,
                transparent 6px,
                transparent 10px
            );
            border: 1px dashed rgba(42, 34, 24, 0.22);
        }

        .yang {
            background: var(--line);
            height: 100%;
            width: 100%;
            border-radius: 1px;
        }

        .yin {
            display: flex;
            width: 100%;
            height: 100%;
            justify-content: space-between;
        }

        .yin div {
            background: var(--line);
            width: 44%;
            height: 100%;
            border-radius: 1px;
        }

        .yang.moving,
        .yin .moving {
            background: var(--moving);
            box-shadow: 0 0 0 1px rgba(192, 57, 43, 0.25);
        }

        .line-type {
            text-align: right;
            white-space: nowrap;
        }

        /* Result */
        .result-box {
            margin-top: 28px;
            text-align: left;
            padding: 22px 0 0;
            border-top: 1px solid rgba(42, 34, 24, 0.18);
            display: none;
            animation: fadeRise 0.55s ease both;
        }

        .result-box.visible { display: block; }

        .result-box h3 {
            font-family: "Noto Serif", serif;
            font-size: 1.15rem;
            margin: 0 0 12px;
            letter-spacing: 0.04em;
        }

        .copy-block {
            margin: 0 0 16px;
            padding: 0;
            border: none;
        }

        .copy-container {
            display: flex;
            gap: 8px;
            align-items: stretch;
            position: relative;
        }

        .copy-input {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 0.875rem;
            border: 1px solid rgba(42, 34, 24, 0.22);
            border-radius: 2px;
            background: rgba(255, 252, 247, 0.85);
            color: var(--ink);
        }

        .btn-copy-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .btn-copy {
            background: #1f4d32;
            color: #f3fff6;
            font-size: 0.875rem;
            padding: 10px 16px;
            white-space: nowrap;
            height: 100%;
        }

        .btn-copy:hover { background: #163824; }

        .copy-tooltip {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            transform: translateX(-50%) translateY(6px);
            background: #1f4d32;
            color: #f3fff6;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 2px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 5;
            box-shadow: 0 6px 16px rgba(26, 21, 16, 0.2);
        }

        .copy-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border: 5px solid transparent;
            border-top-color: #1f4d32;
        }

        .copy-tooltip.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .btn-copy.copied {
            background: #163824;
        }

        /* Dual hexagram visuals */
        .dual-hex {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin: 0 0 16px;
        }

        .dual-hex.has-bien {
            grid-template-columns: 1fr 1fr;
        }

        .hex-card {
            text-align: center;
            padding: 12px 8px;
            background: rgba(255, 252, 247, 0.45);
            border: 1px solid rgba(42, 34, 24, 0.12);
        }

        .hex-card-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--cinnabar-deep);
            margin-bottom: 6px;
        }

        .hex-card-name {
            font-family: "Noto Serif", serif;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .hex-card-trigrams {
            font-size: 0.72rem;
            color: var(--ink-soft);
            margin-bottom: 10px;
        }

        .mini-hex {
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            width: 88px;
            margin: 0 auto;
        }

        .mini-line { height: 8px; width: 100%; }
        .mini-line .yang { height: 100%; }
        .mini-line .yin {
            height: 100%;
            display: flex;
            justify-content: space-between;
        }
        .mini-line .yin div { width: 42%; height: 100%; background: var(--line); }

        .result-row {
            margin: 0 0 8px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .result-row strong {
            color: var(--cinnabar-deep);
            font-weight: 600;
            margin-right: 4px;
        }

        .cast-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(
                180deg,
                rgba(243, 235, 224, 0) 0%,
                rgba(232, 223, 208, 0.92) 35%,
                rgba(232, 223, 208, 0.98) 100%
            );
            pointer-events: none;
        }

        .cast-bar button { pointer-events: auto; }

        button {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 36px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        button:active { transform: translateY(1px); }

        #btnCast {
            background: var(--cinnabar);
            color: #fff8f0;
            box-shadow: 0 8px 24px var(--glow);
            min-width: 200px;
        }

        #btnCast:hover { background: var(--cinnabar-deep); }
        #btnCast:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        @keyframes fadeRise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes lineFill {
            from { opacity: 0.35; transform: scaleX(0.92); }
            to { opacity: 1; transform: scaleX(1); }
        }

        @keyframes coinFlip {
            0% { transform: rotateY(0) scale(1); }
            45% { transform: rotateY(90deg) scale(1.06); }
            100% { transform: rotateY(0) scale(1); }
        }

        @media (max-width: 420px) {
            .page { padding-top: 20px; }
            .line {
                grid-template-columns: 40px 1fr 96px;
                font-size: 0.68rem;
            }
            .coin { width: 64px; height: 64px; }
            #btnCast {
                width: min(100%, 320px);
                min-width: 0;
            }
            .dual-hex.has-bien { gap: 10px; }
            .hex-card-name { font-size: 0.82rem; }
            .mini-hex { width: 72px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <h1 class="brand"><span>Kinh Dịch</span>Gieo Quẻ 6 Hào</h1>
        <p class="lead">Gieo từng hào từ Sơ đến Thượng bằng ba đồng xu (Âm = 2, Dương = 3). Đủ 6 hào, nhấn Gieo Quẻ Mới để bắt đầu lại.</p>

        <div class="progress" aria-label="Tiến trình 6 hào">
            <div class="progress-labels">
                <span>Sơ</span><span>II</span><span>III</span><span>IV</span><span>V</span><span>Thượng</span>
            </div>
            <div class="progress-track" id="progressTrack">
                <div class="progress-step" data-step="0"></div>
                <div class="progress-step" data-step="1"></div>
                <div class="progress-step" data-step="2"></div>
                <div class="progress-step" data-step="3"></div>
                <div class="progress-step" data-step="4"></div>
                <div class="progress-step" data-step="5"></div>
            </div>
        </div>

        <div class="coins" id="coins" aria-live="polite">
            <div class="coin idle" data-coin="0"><span class="coin-face">—</span><span class="coin-val">?</span></div>
            <div class="coin idle" data-coin="1"><span class="coin-face">—</span><span class="coin-val">?</span></div>
            <div class="coin idle" data-coin="2"><span class="coin-face">—</span><span class="coin-val">?</span></div>
        </div>
        <div class="coins-sum" id="coinsSum">Nhấn Gieo Hào để tung 3 đồng xu</div>

        <div class="hexagram-display" id="hexDisplay" aria-live="polite"></div>

        <div class="result-box" id="resultBox">
            <h3>Kết quả quẻ</h3>

            <div class="copy-block">
                <div class="copy-container">
                    <input type="text" id="summaryText" class="copy-input" readonly aria-label="Tóm tắt kết quả" />
                    <div class="btn-copy-wrap">
                        <button type="button" id="btnCopy" class="btn-copy">Sao chép</button>
                        <span id="copyTooltip" class="copy-tooltip" role="status">Đã sao chép!</span>
                    </div>
                </div>
            </div>

            <div class="dual-hex" id="dualHex"></div>

            <p class="result-row"><strong>Quẻ Chủ:</strong> <span id="queChu"></span></p>
            <p class="result-row"><strong>Hào Động:</strong> <span id="haoDong"></span></p>
            <p class="result-row"><strong>Quẻ Biến:</strong> <span id="queBien"></span></p>
        </div>
    </main>

    <div class="cast-bar">
        <button id="btnCast" type="button">Gieo Hào (0/6)</button>
    </div>

<script>
const TRIGRAMS = {
    "111": "Càn", "011": "Đoài", "101": "Ly", "001": "Chấn",
    "110": "Tốn", "010": "Khảm", "100": "Cấn", "000": "Khôn"
};

const HEXAGRAMS = {
    "Càn_Càn": "Thuần Càn", "Khôn_Khôn": "Thuần Khôn", "Khảm_Chấn": "Thủy Lôi Truân", "Cấn_Khảm": "Sơn Thủy Mông",
    "Khảm_Càn": "Thủy Thiên Nhu", "Càn_Khảm": "Thiên Thủy Tụng", "Khảm_Khôn": "Thủy Địa Tỷ", "Khôn_Khảm": "Địa Thủy Sư",
    "Tốn_Càn": "Phong Thiên Tiểu Súc", "Càn_Đoài": "Thiên Trạch Lý", "Khôn_Càn": "Địa Thiên Thái", "Càn_Khôn": "Thiên Địa Bĩ",
    "Càn_Ly": "Thiên Hỏa Đồng Nhân", "Ly_Càn": "Hỏa Thiên Đại Hữu", "Khôn_Cấn": "Địa Sơn Khiêm", "Chấn_Khôn": "Lôi Địa Dự",
    "Đoài_Chấn": "Trạch Lôi Tùy", "Cấn_Tốn": "Sơn Phong Cổ", "Khôn_Đoài": "Địa Trạch Lâm", "Tốn_Khôn": "Phong Địa Quan",
    "Ly_Chấn": "Hỏa Lôi Phệ Hạp", "Cấn_Ly": "Sơn Hỏa Bí", "Cấn_Khôn": "Sơn Địa Bác", "Khôn_Chấn": "Địa Lôi Phục",
    "Càn_Chấn": "Thiên Lôi Vô Vọng", "Cấn_Càn": "Sơn Thiên Đại Súc", "Cấn_Chấn": "Sơn Lôi Di", "Đoài_Tốn": "Trạch Phong Đại Quá",
    "Khảm_Khảm": "Thuần Khảm", "Ly_Ly": "Thuần Ly", "Đoài_Cấn": "Trạch Sơn Hàm", "Chấn_Tốn": "Lôi Phong Hằng",
    "Càn_Cấn": "Thiên Sơn Độn", "Chấn_Càn": "Lôi Thiên Đại Tráng", "Khôn_Ly": "Địa Hỏa Minh Di", "Ly_Khôn": "Hỏa Địa Tấn",
    "Tốn_Ly": "Phong Hỏa Gia Nhân", "Ly_Đoài": "Hỏa Trạch Khuê", "Khảm_Cấn": "Thủy Sơn Kiển", "Chấn_Khảm": "Lôi Thủy Giải",
    "Cấn_Đoài": "Sơn Trạch Tổn", "Tốn_Chấn": "Phong Lôi Ích", "Đoài_Càn": "Trạch Thiên Quải", "Càn_Tốn": "Thiên Phong Cấu",
    "Đoài_Khôn": "Trạch Địa Tụy", "Khôn_Tốn": "Địa Phong Thăng", "Đoài_Khảm": "Trạch Thủy Khốn", "Khảm_Tốn": "Thủy Phong Tỉnh",
    "Đoài_Ly": "Trạch Hỏa Cách", "Ly_Tốn": "Hỏa Phong Đỉnh", "Chấn_Chấn": "Thuần Chấn", "Cấn_Cấn": "Thuần Cấn",
    "Tốn_Cấn": "Phong Sơn Tiệm", "Chấn_Đoài": "Lôi Trạch Quy Muội", "Chấn_Ly": "Lôi Hỏa Phong", "Ly_Cấn": "Hỏa Sơn Lữ",
    "Tốn_Tốn": "Thuần Tốn", "Đoài_Đoài": "Thuần Đoài", "Tốn_Khảm": "Phong Thủy Hoán", "Khảm_Đoài": "Thủy Trạch Tiết",
    "Tốn_Đoài": "Phong Trạch Trung Phu", "Chấn_Cấn": "Lôi Sơn Tiểu Quá", "Khảm_Ly": "Thủy Hỏa Ký Tế", "Ly_Khảm": "Hỏa Thủy Vị Tế"
};

const LINE_LABELS = ["Hào 1", "Hào 2", "Hào 3", "Hào 4", "Hào 5", "Hào 6"];
const CAST_DELAY_MS = 480;

let currentLines = [];
let casting = false;

const btnCast = document.getElementById("btnCast");
const btnCopy = document.getElementById("btnCopy");
const hexDisplay = document.getElementById("hexDisplay");
const coinsEl = document.getElementById("coins");
const coinsSum = document.getElementById("coinsSum");
const progressTrack = document.getElementById("progressTrack");
const copyTooltip = document.getElementById("copyTooltip");

btnCast.addEventListener("click", castLine);
btnCopy.addEventListener("click", copySummary);

initSlots();
updateProgress();
resetCoinsIdle();

function initSlots() {
    hexDisplay.innerHTML = "";
    for (let i = 0; i < 6; i++) {
        const lineDiv = document.createElement("div");
        lineDiv.className = "line empty";
        lineDiv.dataset.index = String(i);
        lineDiv.innerHTML = `
            <span>${LINE_LABELS[i]}</span>
            <div class="line-bar"><div class="line-placeholder"></div></div>
            <span class="line-type">Chưa gieo</span>
        `;
        hexDisplay.appendChild(lineDiv);
    }
}

function updateProgress() {
    const steps = progressTrack.querySelectorAll(".progress-step");
    steps.forEach((step, i) => {
        step.classList.remove("done", "current");
        if (i < currentLines.length) step.classList.add("done");
        else if (i === currentLines.length && currentLines.length < 6) step.classList.add("current");
    });
}

function resetCoinsIdle() {
    coinsEl.querySelectorAll(".coin").forEach((coin) => {
        coin.className = "coin idle";
        coin.innerHTML = `<span class="coin-face">—</span><span class="coin-val">?</span>`;
    });
    coinsSum.textContent = "Nhấn Gieo Hào để tung 3 đồng xu";
}

function showCoins(values) {
    const coins = coinsEl.querySelectorAll(".coin");
    values.forEach((val, i) => {
        const coin = coins[i];
        const isYang = val === 3;
        coin.className = `coin flip ${isYang ? "yang" : "yin"}`;
        coin.innerHTML = `
            <span class="coin-face">${isYang ? "Dương" : "Âm"}</span>
            <span class="coin-val">${val}</span>
        `;
        coin.addEventListener("animationend", () => coin.classList.remove("flip"), { once: true });
    });
    const sum = values.reduce((a, b) => a + b, 0);
    const typeName =
        sum === 6 ? "Lão Âm (X)" :
        sum === 7 ? "Thiếu Dương" :
        sum === 8 ? "Thiếu Âm" :
        "Lão Dương (O)";
    coinsSum.textContent = `${values.join(" + ")} = ${sum} → ${typeName}`;
}

async function castLine() {
    if (casting) return;

    if (currentLines.length >= 6) {
        resetAll();
    }

    casting = true;
    btnCast.disabled = true;

    const values = [
        Math.random() < 0.5 ? 2 : 3,
        Math.random() < 0.5 ? 2 : 3,
        Math.random() < 0.5 ? 2 : 3
    ];
    const sum = values[0] + values[1] + values[2];

    showCoins(values);
    await wait(CAST_DELAY_MS);

    currentLines.push(sum);
    fillSlot(currentLines.length - 1, sum);
    updateProgress();

    if (currentLines.length === 6) {
        btnCast.textContent = "Gieo Quẻ Mới";
        calculateResult();
    } else {
        btnCast.textContent = `Gieo Hào (${currentLines.length}/6)`;
    }

    casting = false;
    btnCast.disabled = false;
}

function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
}

function fillSlot(idx, val) {
    const lineDiv = hexDisplay.querySelector(`[data-index="${idx}"]`);
    if (!lineDiv) return;

    const isMoving = val === 6 || val === 9;
    const movingClass = isMoving ? "moving" : "";
    let barHtml;

    if (val === 7 || val === 9) {
        barHtml = `<div class="yang ${movingClass}"></div>`;
    } else {
        barHtml = `<div class="yin"><div class="${movingClass}"></div><div class="${movingClass}"></div></div>`;
    }

    const typeName =
        val === 6 ? "Lão Âm (X)" :
        val === 7 ? "Thiếu Dương" :
        val === 8 ? "Thiếu Âm" :
        "Lão Dương (O)";

    lineDiv.className = "line filled";
    lineDiv.innerHTML = `
        <span>${LINE_LABELS[idx]}</span>
        <div class="line-bar">${barHtml}</div>
        <span class="line-type">${typeName}</span>
    `;
}

function miniHexHtml(bits, movingSet) {
    // bits[0]=hào1 ... bits[5]=hào6; render column-reverse via CSS
    return bits.map((bit, i) => {
        const moving = movingSet.has(i + 1) ? "moving" : "";
        if (bit === 1) {
            return `<div class="mini-line"><div class="yang ${moving}"></div></div>`;
        }
        return `<div class="mini-line"><div class="yin"><div class="${moving}"></div><div class="${moving}"></div></div></div>`;
    }).join("");
}

function calculateResult() {
    const chuBit = [];
    const bienBit = [];
    const movingLines = [];

    currentLines.forEach((val, index) => {
        if (val === 6) {
            chuBit.push(0);
            bienBit.push(1);
            movingLines.push(index + 1);
        } else if (val === 7) {
            chuBit.push(1);
            bienBit.push(1);
        } else if (val === 8) {
            chuBit.push(0);
            bienBit.push(0);
        } else if (val === 9) {
            chuBit.push(1);
            bienBit.push(0);
            movingLines.push(index + 1);
        }
    });

    const chuNoi = TRIGRAMS[`${chuBit[2]}${chuBit[1]}${chuBit[0]}`];
    const chuNgoai = TRIGRAMS[`${chuBit[5]}${chuBit[4]}${chuBit[3]}`];
    const nameQueChu = HEXAGRAMS[`${chuNgoai}_${chuNoi}`] || `${chuNgoai} ${chuNoi}`;

    const bienNoi = TRIGRAMS[`${bienBit[2]}${bienBit[1]}${bienBit[0]}`];
    const bienNgoai = TRIGRAMS[`${bienBit[5]}${bienBit[4]}${bienBit[3]}`];
    const nameQueBien = HEXAGRAMS[`${bienNgoai}_${bienNoi}`] || `${bienNgoai} ${bienNoi}`;

    document.getElementById("queChu").textContent = `${nameQueChu} (${chuNgoai} trên, ${chuNoi} dưới)`;
    document.getElementById("haoDong").textContent =
        movingLines.length > 0 ? `Hào ${movingLines.join(", ")}` : "Không có hào động";
    document.getElementById("queBien").textContent =
        movingLines.length > 0
            ? `${nameQueBien} (${bienNgoai} trên, ${bienNoi} dưới)`
            : "Không biến";

    const summaryText =
        movingLines.length > 0
            ? `${nameQueChu} động hào ${movingLines.join(", ")} biến ${nameQueBien}`
            : `${nameQueChu} (Tĩnh - Không có hào động)`;

    document.getElementById("summaryText").value = summaryText;

    const movingSet = new Set(movingLines);
    const dual = document.getElementById("dualHex");
    const chuCard = `
        <div class="hex-card">
            <div class="hex-card-title">Quẻ Chủ</div>
            <div class="hex-card-name">${nameQueChu}</div>
            <div class="hex-card-trigrams">${chuNgoai} trên · ${chuNoi} dưới</div>
            <div class="mini-hex">${miniHexHtml(chuBit, movingSet)}</div>
        </div>
    `;

    if (movingLines.length > 0) {
        dual.className = "dual-hex has-bien";
        dual.innerHTML = chuCard + `
            <div class="hex-card">
                <div class="hex-card-title">Quẻ Biến</div>
                <div class="hex-card-name">${nameQueBien}</div>
                <div class="hex-card-trigrams">${bienNgoai} trên · ${bienNoi} dưới</div>
                <div class="mini-hex">${miniHexHtml(bienBit, new Set())}</div>
            </div>
        `;
    } else {
        dual.className = "dual-hex";
        dual.innerHTML = chuCard;
    }

    document.getElementById("resultBox").classList.add("visible");
    copyTooltip.classList.remove("show");
}

function copySummary() {
    const summaryInput = document.getElementById("summaryText");
    const text = summaryInput.value;
    if (!text) return;

    const showOk = () => {
        copyTooltip.classList.add("show");
        btnCopy.classList.add("copied");
        const prev = btnCopy.textContent;
        btnCopy.textContent = "Đã chép!";
        clearTimeout(copySummary._t);
        copySummary._t = setTimeout(() => {
            copyTooltip.classList.remove("show");
            btnCopy.classList.remove("copied");
            btnCopy.textContent = prev;
        }, 2200);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showOk).catch(() => {
            summaryInput.select();
            document.execCommand("copy");
            showOk();
        });
    } else {
        summaryInput.select();
        document.execCommand("copy");
        showOk();
    }
}

function resetAll() {
    currentLines = [];
    initSlots();
    updateProgress();
    resetCoinsIdle();
    document.getElementById("resultBox").classList.remove("visible");
    document.getElementById("summaryText").value = "";
    document.getElementById("dualHex").innerHTML = "";
    document.getElementById("dualHex").className = "dual-hex";
    copyTooltip.classList.remove("show");
    btnCast.textContent = "Gieo Hào (0/6)";
}
</script>
</body>
</html>
